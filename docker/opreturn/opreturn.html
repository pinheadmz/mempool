<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>OP_RETURN Feed</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: #141a2e;
            --text: #dbe2ff;
            --muted: #8fa0ff;
            --accent: #2dd4ff;
            --border: #222a44;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.45;
        }

        header {
            padding: 14px 16px;
            background: linear-gradient(180deg, #111736, #0b1020);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            letter-spacing: 0.4px;
            font-size: 16px;
        }

        main {
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .entry {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .txid {
            display: block;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--accent);
            text-decoration: none;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .txid:hover {
            text-decoration: underline;
        }

        .opreturn {
            margin-top: 10px;
            font-family: var(--mono);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 13px;
            color: var(--text);
        }

        .meta {
            margin-top: 6px;
            font-size: 11px;
            color: var(--muted);
        }

        /* ---------- Small screens ---------- */
        @media (max-width: 600px) {
            header {
                font-size: 14px;
            }

            main {
                padding: 12px;
            }

            .entry {
                padding: 12px;
                border-radius: 8px;
            }

            .opreturn {
                font-size: 12px;
            }
        }
    </style>

</head>
<body>
<header>
    OP_RETURN stream
</header>

<main id="entries">
<!-- INSERT_ENTRIES_HERE -->
</main>

</body>
</html>
